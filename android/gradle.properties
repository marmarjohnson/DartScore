org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# On, since the SDK pin moved to Flutter 3.47.
#
# Flutter 3.44 was the blocker, not the packages. Its FlutterPluginUtils.kt
# walked every subproject and applied `kotlin-android` to any that used AGP
# without declaring KGP itself, with no check on this flag, so plugins holding
# no Kotlin at all, gal for one, had KGP applied to them and AGP 9 refused the
# build. From 3.47 the same file guards that call with isBuiltInKotlinEnabled,
# which reads this property and defaults to true on AGP 9.
#
# Turning it on is what lets share_plus and package_info_plus track their
# current releases again; see pubspec.yaml.
android.builtInKotlin=true
# Take the barcode model out of the app and let Play Services supply it.
# Bundled, it costs around 20 MB of the download for a screen most users open
# once, when they move to a new device. Unbundled it is a few hundred KB, at
# the price of the model being fetched before the first scan; the DEPENDENCIES
# meta-data in AndroidManifest.xml asks for that at install time, so in
# practice it is already there by the time anyone scans.
dev.steenbakker.mobile_scanner.useUnbundled=true
